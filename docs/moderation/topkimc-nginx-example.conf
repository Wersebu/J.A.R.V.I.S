# Example deployment shape:
# - TopkiMC calls JARVIS at http://127.0.0.1:8080/v1/moderate from the same Ubuntu host.
# - Public nginx does not expose /v1/moderate.
# - The bearer secret is still mandatory inside JARVIS.

server {
    listen 443 ssl http2;
    server_name jarvis.example.com;

    location = /v1/moderate {
        return 404;
    }

    location = /v1/moderate/health {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
