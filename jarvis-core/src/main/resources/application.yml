spring:
  application:
    name: jarvis

server:
  port: 8080

jarvis:
  version: "2.2.1"
  ai:
    identity-file: file:config/jarvis.md
  diagnostics:
    enabled: true
    request-history-size: 100
    log-prompt-preview: false
    expose-debug-api: true
  tools:
    enabled: true
    max-calls-fast: 2
    max-calls-research: 8
    max-consecutive-failures: 2
    timeout-seconds: 180
    approval:
      resume-tool-loop-after-approval: true
      generate-final-answer: true
  knowledge:
    filing:
      enabled: true
      use-ai-planner: true
      category-confidence-threshold: 0.70
      inbox-fallback-enabled: true
      inspect-tree-before-write: true
      search-before-create: true
      update-existing-document: true
      raw-message-storage: false
  thinking:
    stream-to-clients: true
    persist: false
    default-visible-in-windows: true
  ollama:
    base-url: http://localhost:11434
    model: gpt-oss:20b
    keep-alive: 30m
    interactive-priority: true
  decision:
    reasoning-complexity-threshold: 6
    large-prompt-token-threshold: 800
    knowledge-document-estimate: 4
    knowledge-context-characters-per-document: 1500
  memory:
    database-path: ./data/jarvis-memory.db
    working-history-length: 20
    embedding:
      model: nomic-embed-text
    background:
      enabled: true
      executor-threads: 1
      queue-capacity: 100
      chat-priority: true
      skip-when-queue-full: false

brains:
  FAST:
    provider: ollama
    model: gpt-oss:20b
    description: GPT-OSS with LOW reasoning for greetings and simple questions.
  REASONING:
    provider: ollama
    model: gpt-oss:20b
    description: GPT-OSS with MEDIUM or HIGH reasoning for knowledge, programming, and analysis.
  CLASSIFIER:
    provider: ollama
    model: gpt-oss:20b
    description: GPT-OSS with LOW reasoning for background memory decisions.

knowledge:
  root: ./knowledge
  watch: true
  preview-length: 500
  watcher-debounce-ms: 300
  workspace:
    write-mode: AUTO_DRAFT
    history-directory: .history
    drafts-directory: .drafts
