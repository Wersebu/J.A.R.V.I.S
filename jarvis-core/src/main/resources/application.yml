spring:
  application:
    name: jarvis

server:
  port: 8080

jarvis:
  version: "2.22.0"
  websocket:
    max-text-message-size: 4194304
    max-binary-message-size: 8388608
  workspace:
    root: ./temp-workspaces
    ttl: 60m
    cleanup-interval: 5m
    max-file-size-bytes: 2097152
    max-workspace-size-bytes: 20971520
    max-total-size-bytes: 209715200
    max-files-per-workspace: 20
    minimum-free-disk-space-bytes: 536870912
    prompt-max-characters: 24000
  ai:
    identity-file: file:config/jarvis.md
    context-window: 100000
    reserved-output-tokens: 2048
    # Ollama sampler repeat_penalty sent with every request. Without this, Ollama/llama.cpp
    # defaults to 1.0 (no penalty), letting a local model settle into repeating the exact same
    # short token sequence forever - especially at high temperature. 1.1 is Ollama's own
    # traditional default and is enough to break that failure mode.
    repeat-penalty: 1.1
  diagnostics:
    enabled: true
    request-history-size: 100
    log-prompt-preview: false
    expose-debug-api: true
    # Full AI/tool diagnostic trace (see docs/AI_TRACE.md and README "Diagnostics"): logs the exact
    # outbound Ollama request payload, every model tool call, tool/MCP execution boundary, and tool
    # results. DEBUG-only - can log an entire conversation, system prompt, and tool arguments
    # verbatim. Independent of log-prompt-preview above. Defaults to off; negligible cost when off.
    log-full-ai-request: false
    log-tool-calls: false
    log-tool-results: false
  tools:
    enabled: true
    runtime: native
    # A genuinely multi-stage task (e.g. Store Audit: read workflow, create dataset, verify,
    # geocode, optimize route, notify, final answer) easily needs 6-10 native tool-loop turns.
    # 2 was only ever enough for the simplest single-lookup tasks and forced the loop to cut off
    # mid-task, producing an invalid/rushed call once the budget ran out.
    max-calls-fast: 8
    max-calls-research: 15
    max-consecutive-failures: 2
    # 0 disables the wall-clock timeout entirely. A slow local model doing genuine, useful work
    # (each turn has been observed taking 45-80s, and a long coding task legitimately needs many
    # turns) must never be cut off mid-task just because a clock ran out - the loop is still
    # bounded by max-calls-* above and the no-progress/duplicate-detection guards, the same way an
    # agent like Codex or Claude Code is only limited by real forward progress, not a timer.
    timeout-seconds: 0
    max-consecutive-operation-repeats: 5
    approval:
      resume-tool-loop-after-approval: true
      generate-final-answer: true
  coding:
    opencode:
      enabled: true
      executable: opencode
      provider-name: jarvis-ollama
      base-url: ${JARVIS_CODING_OPENCODE_BASE_URL:http://SERVER_IP:11434/v1}
      model: ${JARVIS_CODING_OPENCODE_MODEL:gpt-oss:20b}
      request-timeout: 120s
      task-timeout: 6h
      max-concurrent-tasks-per-user: 1
      require-approval-for-dangerous-actions: true
  mcp:
    enabled: true
    servers:
      roblox:
        enabled: true
        execution-host: WINDOWS
        transport: WINDOWS_BRIDGE
        command: cmd.exe
        args:
          - /c
          - "cd /d %LOCALAPPDATA%\\Roblox && .\\mcp.bat"
        access-level: EDIT
        startup-timeout: 10s
        initialize-timeout: 10s
        list-tools-timeout: 5s
        # Roblox Studio must actually be running and its companion plugin attached before a real
        # tools/call (e.g. list_roblox_studios) can answer - unlike a local, always-ready STDIO MCP
        # server, this Windows-hosted server can legitimately take longer than a generic default on
        # a cold start. 30s was observed timing out twice in a row before succeeding once Studio
        # finished attaching.
        call-timeout: 60s
  web-search:
    enabled: true
    base-url: http://127.0.0.1:8888
    default-max-results: 5
    current-fact-max-results: 8
    market-max-results: 15
    max-search-attempts: 4
    max-page-reads: 5
    market-min-observations: 3
    hard-max-results: 15
    snippet-max-length: 320
    page-max-length: 8000
    connect-timeout: 2s
    read-timeout: 8s
  location:
    enabled: true
    nominatim-base-url: https://nominatim.openstreetmap.org
    osrm-base-url: https://router.project-osrm.org
    user-agent: "JARVIS-Core-LocationTool/1.0 (+https://github.com/; contact: set-a-real-contact-before-production)"
    min-geocode-interval-millis: 1100
    max-batch-size: 25
    exact-optimization-max-stops: 8
    connect-timeout: 3s
    read-timeout: 8s
    geocode-candidate-limit: 5
  thinking:
    stream-to-clients: true
    persist: false
    default-visible-in-windows: true
  model:
    active-model-file: file:config/active-model.txt
  ollama:
    base-url: http://localhost:11434
    model: gpt-oss:20b
    keep-alive: -1m
    # Exact model names (case-insensitive) always treated as vision-capable, even when Ollama's own
    # /api/tags or /api/show response for that model does not list "vision" in its capabilities.
    # Normally capability detection is trusted as-is - never assumed from a model name - because it
    # is provider-reported. Use this only when a model confirmed multimodal on its Ollama library
    # page still comes back without "vision" locally (a capability auto-detection gap for that
    # architecture/build). Empty by default.
    vision-capability-overrides: []
  moderation:
    enabled: ${JARVIS_MODERATION_ENABLED:false}
    model: ${JARVIS_MODERATION_MODEL:}
    api-key: ${TOPKIMC_MODERATION_API_KEY:}
    timeout: ${JARVIS_MODERATION_TIMEOUT_SECONDS:180}s
    policy-version: ${JARVIS_MODERATION_POLICY_VERSION:v1}
    max-body-bytes: 64000
    max-text-chars: 20000
    max-title-chars: 160
    max-urls: 50
    max-youtube-video-ids: 20
    max-parallel: ${JARVIS_MODERATION_MAX_PARALLEL:2}
    max-queue: ${JARVIS_MODERATION_MAX_QUEUE:8}
    queue-timeout: ${JARVIS_MODERATION_QUEUE_TIMEOUT_SECONDS:2}s
    requests-per-minute: ${JARVIS_MODERATION_REQUESTS_PER_MINUTE:60}
  qwen-thinking-budget:
    # Applies only to this exact model name (case/whitespace-insensitive) - never a family prefix.
    target-model: qwen3.5:9b
    # OFF | LOW | NORMAL | HIGH | MAX
    mode: NORMAL
    low-tokens: 250
    normal-tokens: 500
    high-tokens: 1500
    interactive-priority: true
  model-startup:
    # The main LLM is never listed here - it is warmed automatically at startup as whichever model
    # jarvis.model.active-model-file / ActiveModelService resolves as active, not a name hardcoded
    # in this file. Only secondary, provider-independent models (speech/vision) belong here.
    models:
      Chatterbox:
        startup-policy: LAZY
      Whisper:
        startup-policy: LAZY
      Vision:
        startup-policy: LAZY
  decision:
    reasoning-complexity-threshold: 6
    large-prompt-token-threshold: 800
    knowledge-document-estimate: 4
    knowledge-context-characters-per-document: 1500
  memory:
    database-path: ./data/jarvis-memory.db
    working-history-length: 30
    semantic-sql:
      enabled: false
    background-agent:
      enabled: false
    legacy:
      retrieval-enabled: false
      writes-enabled: false
      keep-tables: true
    embedding:
      model: nomic-embed-text
    background:
      enabled: false
      executor-threads: 1
      queue-capacity: 100
      chat-priority: true
      skip-when-queue-full: false
  conversation:
    history:
      enabled: true
      max-messages: 30
      max-characters: 30000
      include-tool-results: true
      include-system-events: false
      include-thinking: false
    images:
      enabled: true
      retention: 60m
      max-active-images: 8
      max-total-bytes: 16777216
      auto-attach-mode: REFERENCED_OR_RECENT

brains:
  FAST:
    provider: ollama
    model: gpt-oss:20b
    description: GPT-OSS with LOW reasoning for greetings and simple questions.
  REASONING:
    provider: ollama
    model: gpt-oss:20b
    description: GPT-OSS with MEDIUM or HIGH reasoning for knowledge, programming, and analysis.
  CLASSIFIER:
    provider: ollama
    model: gpt-oss:20b
    description: GPT-OSS with LOW reasoning for background memory decisions.

knowledge:
  root: ./knowledge
  watch: true
  preview-length: 500
  watcher-debounce-ms: 300
  workspace:
    write-mode: AUTO_DRAFT
    history-directory: .history
    drafts-directory: .drafts
  persistence:
    mode: EXPLICIT_ONLY
