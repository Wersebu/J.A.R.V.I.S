spring:
  application:
    name: jarvis

server:
  port: 8080

jarvis:
  version: "2.12.0"
  workspace:
    root: ./temp-workspaces
    ttl: 60m
    cleanup-interval: 5m
    max-file-size-bytes: 2097152
    max-workspace-size-bytes: 20971520
    max-total-size-bytes: 209715200
    max-files-per-workspace: 20
    minimum-free-disk-space-bytes: 536870912
    prompt-max-characters: 24000
  ai:
    identity-file: file:config/jarvis.md
    context-window: 16384
    reserved-output-tokens: 2048
  diagnostics:
    enabled: true
    request-history-size: 100
    log-prompt-preview: false
    expose-debug-api: true
  tools:
    enabled: true
    runtime: native
    # A genuinely multi-stage task (e.g. Store Audit: read workflow, create dataset, verify,
    # geocode, optimize route, notify, final answer) easily needs 6-10 native tool-loop turns.
    # 2 was only ever enough for the simplest single-lookup tasks and forced the loop to cut off
    # mid-task, producing an invalid/rushed call once the budget ran out.
    max-calls-fast: 8
    max-calls-research: 15
    max-consecutive-failures: 2
    # Raised alongside max-calls-* above: more turns need more wall-clock time, especially with a
    # slow-loading local model (each turn here has been observed taking 45-80s).
    timeout-seconds: 600
    max-consecutive-operation-repeats: 5
    approval:
      resume-tool-loop-after-approval: true
      generate-final-answer: true
  web-search:
    enabled: true
    base-url: http://127.0.0.1:8888
    default-max-results: 5
    current-fact-max-results: 8
    market-max-results: 15
    max-search-attempts: 4
    max-page-reads: 5
    market-min-observations: 3
    hard-max-results: 15
    snippet-max-length: 320
    page-max-length: 8000
    connect-timeout: 2s
    read-timeout: 8s
  location:
    enabled: true
    nominatim-base-url: https://nominatim.openstreetmap.org
    osrm-base-url: https://router.project-osrm.org
    user-agent: "JARVIS-Core-LocationTool/1.0 (+https://github.com/; contact: set-a-real-contact-before-production)"
    min-geocode-interval-millis: 1100
    max-batch-size: 25
    exact-optimization-max-stops: 8
    connect-timeout: 3s
    read-timeout: 8s
    geocode-candidate-limit: 5
  thinking:
    stream-to-clients: true
    persist: false
    default-visible-in-windows: true
  model:
    active-model-file: file:config/active-model.txt
  ollama:
    base-url: http://localhost:11434
    model: gpt-oss:20b
    keep-alive: -1m
    # Exact model names (case-insensitive) always treated as vision-capable, even when Ollama's own
    # /api/tags or /api/show response for that model does not list "vision" in its capabilities.
    # Normally capability detection is trusted as-is - never assumed from a model name - because it
    # is provider-reported. Use this only when a model confirmed multimodal on its Ollama library
    # page still comes back without "vision" locally (a capability auto-detection gap for that
    # architecture/build). Empty by default.
    vision-capability-overrides: []
  qwen-thinking-budget:
    # Applies only to this exact model name (case/whitespace-insensitive) - never a family prefix.
    target-model: qwen3.5:9b
    # OFF | LOW | NORMAL | HIGH | MAX
    mode: NORMAL
    low-tokens: 250
    normal-tokens: 500
    high-tokens: 1500
    interactive-priority: true
  model-startup:
    models:
      "[gpt-oss:20b]":
        startup-policy: EAGER
        keep-alive: -1m
      Chatterbox:
        startup-policy: LAZY
      Whisper:
        startup-policy: LAZY
      Vision:
        startup-policy: LAZY
  decision:
    reasoning-complexity-threshold: 6
    large-prompt-token-threshold: 800
    knowledge-document-estimate: 4
    knowledge-context-characters-per-document: 1500
  memory:
    database-path: ./data/jarvis-memory.db
    working-history-length: 30
    semantic-sql:
      enabled: false
    background-agent:
      enabled: false
    legacy:
      retrieval-enabled: false
      writes-enabled: false
      keep-tables: true
    embedding:
      model: nomic-embed-text
    background:
      enabled: false
      executor-threads: 1
      queue-capacity: 100
      chat-priority: true
      skip-when-queue-full: false
  conversation:
    history:
      enabled: true
      max-messages: 30
      max-characters: 30000
      include-tool-results: true
      include-system-events: false
      include-thinking: false

brains:
  FAST:
    provider: ollama
    model: gpt-oss:20b
    description: GPT-OSS with LOW reasoning for greetings and simple questions.
  REASONING:
    provider: ollama
    model: gpt-oss:20b
    description: GPT-OSS with MEDIUM or HIGH reasoning for knowledge, programming, and analysis.
  CLASSIFIER:
    provider: ollama
    model: gpt-oss:20b
    description: GPT-OSS with LOW reasoning for background memory decisions.

knowledge:
  root: ./knowledge
  watch: true
  preview-length: 500
  watcher-debounce-ms: 300
  workspace:
    write-mode: AUTO_DRAFT
    history-directory: .history
    drafts-directory: .drafts
  persistence:
    mode: EXPLICIT_ONLY
