spring:
  application:
    name: jarvis

server:
  port: 8080

jarvis:
  version: "0.9"
  ai:
    base-url: http://localhost:11434
    identity-file: file:config/jarvis.md
  decision:
    reasoning-complexity-threshold: 6
    large-prompt-token-threshold: 800
    knowledge-document-estimate: 4
    knowledge-context-characters-per-document: 1500

brains:
  FAST:
    provider: ollama
    model: qwen3:8b
    description: Fast responses for greetings and simple questions.
  REASONING:
    provider: ollama
    model: qwen3:14b
    description: Deeper reasoning for programming, architecture, planning, and longer requests.
  CLASSIFIER:
    provider: ollama
    model: qwen3:0.6b
    description: Future classifier brain for routing decisions only.

knowledge:
  root: ./knowledge
  watch: true
  preview-length: 500
